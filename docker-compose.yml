# BioPass Community — full stack: PostgreSQL (db) + API/Admin UI (api)
#
#   cp .env.example .env   # set AUTH_SECRET and POSTGRES_PASSWORD
#   docker compose up --build -d
#
# Project name is `biopass-community` (network: biopass-community_internal) so it
# does not collide with an older stack that used project name `biopass`.
# If you still see label errors for biopass_default:
#   docker network rm biopass_default
#
# API is bound to 127.0.0.1 by default. For a public VPS put a reverse proxy
# in front, or set API_HOST_BIND=0.0.0.0 (not recommended without TLS).

name: biopass-community

x-api-environment: &api-environment
  NODE_ENV: production
  PORT: "3030"
  DATABASE_URL: postgresql://biopass:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/biopass
  AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET in .env — openssl rand -hex 32}
  PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:3030}
  FRONTEND_ORIGIN: ${PUBLIC_BASE_URL:-http://localhost:3030}
  CORS_ORIGINS: ${CORS_ORIGINS:-}
  TRUST_PROXY: ${TRUST_PROXY:-0}
  CONTACT_EMAIL: ${CONTACT_EMAIL:-}
  MAINTENANCE_EMAIL: ${MAINTENANCE_EMAIL:-}
  TZ_OFFSET: ${TZ_OFFSET:-+00:00}
  ENABLE_SWAGGER: ${ENABLE_SWAGGER:-0}
  SKIP_AUTO_SCHEMA_SYNC: ${SKIP_AUTO_SCHEMA_SYNC:-0}
  ALLOW_SCHEMA_FORCE: ${ALLOW_SCHEMA_FORCE:-0}
  AUTH_ACCESS: ${AUTH_ACCESS:-}
  AUTH_REFRESH: ${AUTH_REFRESH:-}
  AUTH_ACCESS_APP: ${AUTH_ACCESS_APP:-}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASS: ${SMTP_PASS:-}
  SMTP_SERVICE: ${SMTP_SERVICE:-}
  FIREBASE_SERVICE_ACCOUNT_JSON: ${FIREBASE_SERVICE_ACCOUNT_JSON:-firebase-service-account.json}
  INIT_ADMIN_EMAIL: ${INIT_ADMIN_EMAIL:-}
  INIT_ADMIN_PASSWORD: ${INIT_ADMIN_PASSWORD:-}
  INIT_ADMIN_NAME: ${INIT_ADMIN_NAME:-Admin}
  INIT_ADMIN_PHONE: ${INIT_ADMIN_PHONE:-}
  APP_DOWNLOAD_URL_IOS: ${APP_DOWNLOAD_URL_IOS:-https://apps.apple.com/kr/app/bio-pass/id6760216314}
  APP_DOWNLOAD_URL_ANDROID: ${APP_DOWNLOAD_URL_ANDROID:-}
  APP_DEEP_LINK_SCHEME: ${APP_DEEP_LINK_SCHEME:-biopass}
  APP_PACKAGE_ANDROID: ${APP_PACKAGE_ANDROID:-com.mfa.biopass}

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    networks: [internal]
    environment:
      POSTGRES_USER: biopass
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: biopass
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - biopass_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U biopass -d biopass"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${BIOPASS_IMAGE:-ghcr.io/fhwang0926/biopass-community}:${IMAGE_TAG:-latest}
    restart: unless-stopped
    networks: [internal]
    ports:
      - "${API_HOST_BIND:-127.0.0.1}:${API_PORT:-3030}:3030"
    environment:
      <<: *api-environment
    volumes:
      - biopass_upload:/app/upload
      - biopass_json:/app/json
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "--input-type=module",
          "-e",
          "const r=await fetch('http://127.0.0.1:3030/ping'); process.exit(r.ok?0:1)",
        ]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 45s

networks:
  internal:
    driver: bridge

volumes:
  biopass_pg:
  biopass_upload:
  biopass_json:
